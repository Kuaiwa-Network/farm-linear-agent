name: Offline tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    name: Offline / ${{ matrix.os }} / Python 3.13${{ matrix.suffix }}
    runs-on: ${{ matrix.os }}
    # Two Windows shards can exceed 60 minutes as new modules shift the split.
    # Keep every check, with whole test modules split across four isolated jobs.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            shard: 0
            shards: 1
            suffix: ''
          - os: windows-latest
            shard: 0
            shards: 4
            suffix: ' / shard 1'
          - os: windows-latest
            shard: 1
            shards: 4
            suffix: ' / shard 2'
          - os: windows-latest
            shard: 2
            shards: 4
            suffix: ' / shard 3'
          - os: windows-latest
            shard: 3
            shards: 4
            suffix: ' / shard 4'
    env:
      PYTHONUTF8: "1"
      PYTHONUNBUFFERED: "1"
      OFFLINE_SHARD: ${{ matrix.shard }}
      OFFLINE_SHARDS: ${{ matrix.shards }}
    steps:
      - name: Check out candidate
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Prepare optional UI test dependency
        shell: python
        run: |
          import subprocess
          import sys
          subprocess.run([sys.executable, "-m", "pip", "--isolated", "install",
                          "--only-binary=:all:", "--require-hashes", "--no-deps",
                          "--disable-pip-version-check", "--index-url", "https://pypi.org/simple",
                          "-r", "requirements-ui.txt"], check=True)

      - name: Check fixture dependencies
        shell: python
        run: |
          import pathlib
          import subprocess
          import sys
          import tempfile
          print(sys.version)
          subprocess.run(["git", "--version"], check=True)
          subprocess.run(["git", "lfs", "version"], check=True)
          # Symlink rejection tests are part of the safety boundary on both OSes.
          # Fail when the runner lacks this capability instead of skipping them.
          with tempfile.TemporaryDirectory() as directory:
              root = pathlib.Path(directory)
              (root / "target").mkdir()
              (root / "link").symlink_to(root / "target", target_is_directory=True)
              assert (root / "link").is_symlink()

      - name: Set up pinned Go for the fixed service relay
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.6"
          cache: false

      - name: Test and cross-build fixed service relay
        shell: python
        run: |
          import os
          import pathlib
          import subprocess
          import tempfile
          source = pathlib.Path("agent/probes/server-proxy").resolve()
          env = dict(os.environ, GOENV="off", GOWORK="off", GOTOOLCHAIN="local", GOPROXY="off", GOSUMDB="off")
          for name in list(env):
              if name.upper().startswith(("FARMBOT_", "FAKE_CLI_", "DOCKER_", "COMPOSE_")) or name.upper() in {
                  "GH_TOKEN", "GITHUB_TOKEN", "GH_ENTERPRISE_TOKEN", "GITHUB_ENTERPRISE_TOKEN"
              }:
                  del env[name]
          subprocess.run(["go", "test", "-count=1", "-timeout=30s", "./..."], cwd=source, env=env, check=True)
          with tempfile.TemporaryDirectory() as directory:
              subprocess.run(["go", "build", "-trimpath", "-o", str(pathlib.Path(directory) / "server-proxy"), "."],
                             cwd=source, env=dict(env, GOOS="linux", GOARCH="amd64", CGO_ENABLED="0"), check=True)

      - name: Run offline suite
        shell: python
        run: |
          import contextlib
          import json
          import os
          import pathlib
          import platform
          import subprocess
          import sys
          import time
          import unittest

          # Discovery and its child processes must use the fixtures' selectors.
          # Do not expose inherited GitHub tokens to the suite or fake workers.
          for name in list(os.environ):
              if name.upper().startswith(("FARMBOT_", "FAKE_CLI_")) or name.upper() in {
                  "GH_TOKEN", "GITHUB_TOKEN", "GH_ENTERPRISE_TOKEN", "GITHUB_ENTERPRISE_TOKEN"
              }:
                  del os.environ[name]

          sys.path.insert(0, str(pathlib.Path.cwd()))

          class RecordedResult(unittest.TextTestResult):
              def __init__(self, *args, **kwargs):
                  super().__init__(*args, **kwargs)
                  self.executed = []
                  self.began = []
                  self.ended = []

              def startTest(self, test):
                  self.executed.append(test.id())
                  super().startTest(test)
                  self.began.append(time.monotonic())

              # Cleanups run before stopTest, so a test's seconds include them.
              def stopTest(self, test):
                  self.ended.append(time.monotonic())
                  super().stopTest(test)

          reports = pathlib.Path("reports/offline")
          reports.mkdir(parents=True, exist_ok=True)
          versions = {
              "python": sys.version,
              "platform": platform.platform(),
              "git": subprocess.check_output(["git", "--version"], text=True).strip(),
              "git_lfs": subprocess.check_output(["git", "lfs", "version"], text=True).strip(),
              "revision": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
          }
          started = time.monotonic()
          with (reports / "unittest.log").open("w", encoding="utf-8") as log:
              with contextlib.redirect_stdout(log), contextlib.redirect_stderr(log):
                  def cases(suite):
                      for entry in suite:
                          if isinstance(entry, unittest.TestSuite):
                              yield from cases(entry)
                          else:
                              yield entry

                  catalogue = list(cases(unittest.defaultTestLoader.discover("tests")))
                  module = lambda test: test.id().rsplit(".", 2)[0]
                  modules = sorted({module(test) for test in catalogue})
                  shard, shards = int(os.environ["OFFLINE_SHARD"]), int(os.environ["OFFLINE_SHARDS"])
                  assert shards > 0 and 0 <= shard < shards
                  selected_modules = set(modules[shard::shards])
                  selected = [test for test in catalogue if module(test) in selected_modules]
                  selected_ids = [test.id() for test in selected]
                  native_catalogue = [test.id() for test in catalogue if test.id().startswith("test_windows_workers.")]
                  suite = unittest.TestSuite(selected)
                  result = unittest.TextTestRunner(
                      stream=log, verbosity=2, resultclass=RecordedResult).run(suite)
          skipped = {test.id(): reason for test, reason in result.skipped}
          native = [name for name in result.executed if name.startswith("test_windows_workers.")]
          expected_native = [name for name in selected_ids if name.startswith("test_windows_workers.")]
          native_ok = os.name != "nt" or (bool(native_catalogue) and native == expected_native
                                          and not any(name in skipped for name in expected_native))
          summary = {
              **versions,
              "seconds": time.monotonic() - started,
              "tests": result.testsRun,
              "shard": shard,
              "shards": shards,
              "catalogue_tests": len(catalogue),
              "selected_modules": sorted(selected_modules),
              "selected_tests": selected_ids,
              "failures": [test.id() for test, _ in result.failures],
              "errors": [test.id() for test, _ in result.errors],
              "skipped": skipped,
              "native_windows_tests": native,
              "native_windows_required_checks_ran": native_ok,
          }
          # Offsets count from the same start as the summary's seconds.
          durations = {
              name: {"started": round(began - started, 6), "seconds": round(ended - began, 6)}
              for name, began, ended in zip(result.executed, result.began, result.ended)
          }
          slowest = sorted(durations, key=lambda name: durations[name]["seconds"], reverse=True)[:20]
          summary["slowest"] = [
              {"test": name, "seconds": durations[name]["seconds"]} for name in slowest]
          (reports / "summary.json").write_text(json.dumps(summary, indent=2) + "\n", encoding="utf-8")
          (reports / "durations.json").write_text(json.dumps(durations, indent=2) + "\n", encoding="utf-8")
          print((reports / "unittest.log").read_text(encoding="utf-8"))
          print(f"Slowest {len(slowest)} of {len(durations)} tests (seconds, started at, test):")
          for name in slowest:
              entry = durations[name]
              print(f"{entry['seconds']:10.3f} {entry['started']:10.3f}  {name}")
          if not native_ok:
              print("Windows Job Object tests were missing or skipped", file=sys.stderr)
          complete = result.executed == selected_ids
          sys.exit(0 if result.wasSuccessful() and result.testsRun and native_ok and complete else 1)

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: offline-${{ matrix.os }}-python-3.13-shard-${{ matrix.shard }}
          path: reports/offline/
          if-no-files-found: warn
          retention-days: 14

  windows-status:
    # Preserve the original Windows check name; every matrix job must succeed.
    name: Offline / windows-latest / Python 3.13
    needs: offline
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require complete offline matrix
        env:
          OFFLINE_RESULT: ${{ needs.offline.result }}
        run: test "$OFFLINE_RESULT" = success
